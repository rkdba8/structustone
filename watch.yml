name: Apartment watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_current_matches:
        description: "Test: renvoyer maintenant toutes les annonces qui correspondent aux critères"
        required: false
        default: false
        type: boolean
      test_limit:
        description: "Combien d'annonces actuelles renvoyer pour le test (0 = toutes)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: apartment-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.send_current_matches || false }}
          FORCE_SEND_LIMIT: ${{ inputs.test_limit || '1' }}
        run: python -u watcher.py

      - name: Persist watcher state
        if: always()
        run: |
          if git diff --quiet -- seen.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update apartment watcher state"
          git push
